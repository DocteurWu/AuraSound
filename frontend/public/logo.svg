  </defs>
  <circle cx="50" cy="50" r="45" fill="#0b0d14" stroke="url(#auraGrad)" stroke-width="2" />
  <rect x="22" y="40" width="6" height="20" rx="3" fill="url(#auraGrad)" filter="url(#glow)" />
  <rect x="34" y="28" width="6" height="44" rx="3" fill="url(#auraGrad)" filter="url(#glow)" />
  <rect x="47" y="18" width="6" height="64" rx="3" fill="url(#auraGrad)" filter="url(#glow)" />
  <rect x="60" y="32" width="6" height="36" rx="3" fill="url(#auraGrad)" filter="url(#glow)" />
  <rect x="72" y="42" width="6" height="16" rx="3" fill="url(#auraGrad)" filter="url(#glow)" />
</svg>
